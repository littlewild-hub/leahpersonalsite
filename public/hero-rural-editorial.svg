<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">Appalachian mountain horizon with botanical linework</title>
<desc id="desc">Warm peach and terracotta sky over layered blue Appalachian mountains with dense copper and navy wildflower linework on the right.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fae2d2"/>
    <stop offset=".38" stop-color="#f8c8a6"/>
    <stop offset=".72" stop-color="#f0a072"/>
    <stop offset="1" stop-color="#e98660"/>
  </linearGradient>
  <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff8f1" stop-opacity=".76"/>
    <stop offset=".52" stop-color="#fff8f1" stop-opacity=".13"/>
    <stop offset="1" stop-color="#fff8f1" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="13"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .075"/></feComponentTransfer>
  </filter>
  <g id="leaf">
    <path d="M0 0 C7-14 18-15 23-4 C15 5 6 6 0 0Z"/>
    <path d="M1 0 C8-4 15-5 22-4" fill="none"/>
  </g>
  <g id="sprig">
    <path d="M0 0 Q27-31 54-62" fill="none"/>
    <use href="#leaf" transform="translate(15 -18) rotate(-28) scale(.72)"/>
    <use href="#leaf" transform="translate(29 -35) rotate(28) scale(.66)"/>
    <use href="#leaf" transform="translate(44 -52) rotate(-25) scale(.58)"/>
  </g>
  <g id="flower">
    <ellipse cx="0" cy="-9" rx="5" ry="10"/>
    <ellipse cx="8" cy="-2" rx="5" ry="10" transform="rotate(60 8 -2)"/>
    <ellipse cx="5" cy="8" rx="5" ry="10" transform="rotate(120 5 8)"/>
    <ellipse cx="-5" cy="8" rx="5" ry="10" transform="rotate(-120 -5 8)"/>
    <ellipse cx="-8" cy="-2" rx="5" ry="10" transform="rotate(-60 -8 -2)"/>
    <circle r="3.6" fill="#ef9466"/>
  </g>
</defs>

