<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered Appalachian mountain horizon with botanical linework</title>
  <desc id="desc">A warm peach sky fades into layered blue mountain ridges, with copper and navy wildflower linework rising from the lower right.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8d3bc"/>
      <stop offset="0.48" stop-color="#f4ad7f"/>
      <stop offset="1" stop-color="#e98b64"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" x2="1">
      <stop offset="0" stop-color="#fff3e8" stop-opacity=".62"/>
      <stop offset=".6" stop-color="#fff3e8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff3e8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grain" width="220" height="220" patternUnits="userSpaceOnUse">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7"/>
      </filter>
      <rect width="220" height="220" filter="url(#noise)" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="980" cy="230" rx="560" ry="180" fill="#fff0df" opacity=".25" filter="url(#soft)"/>
